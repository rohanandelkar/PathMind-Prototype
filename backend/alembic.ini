# A generic configuration file for Alembic database migrations.

[alembic]
script_location = alembic
sqlalchemy.url = postgresql://postgres:1234@localhost:5432/personalized_learning_db

[post_write_hooks]

[loggers]
keys = root,sentinel,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sentinel]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers = console

[logger_alembic]
level = INFO
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
